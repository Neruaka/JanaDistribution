services:

  postgres:
    image: postgres:15-alpine
    container_name: jana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jana_distribution}
      POSTGRES_USER: ${POSTGRES_USER:-jana_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jana_dev_password}
    ports:
      # T13-23 : idealement "127.0.0.1:5432:5432" (comme redis ci-dessous),
      # mais un service PostgreSQL natif Windows deja present sur ce poste de
      # dev squatte 0.0.0.0:5432 et empeche Docker de reserver le loopback
      # exclusivement — verifie en conditions reelles (bind refuse par
      # Windows). Reste en 0.0.0.0 localement ; a restreindre en 127.0.0.1
      # sur tout hote sans ce conflit.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jana_user} -d ${POSTGRES_DB:-jana_distribution}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - jana-network

  redis:
    image: redis:7-alpine
    container_name: jana-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - jana-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: jana-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: development
      # Override DB pour pointer vers le container postgres (priorité sur .env)
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-jana_distribution}
      DB_USER: ${POSTGRES_USER:-jana_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-jana_dev_password}
      DATABASE_URL: postgresql://${POSTGRES_USER:-jana_user}:${POSTGRES_PASSWORD:-jana_dev_password}@postgres:5432/${POSTGRES_DB:-jana_distribution}
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jana-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: jana-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VITE_API_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - jana-network

volumes:
  postgres_data:
  redis_data:

networks:
  jana-network:
    driver: bridge
