# fly.toml — Jana Distribution frontend (React SPA servie par Nginx)
# @see https://fly.io/docs/reference/configuration/

app = "jana-frontend"
primary_region = "cdg"

[build]
  [build.args]
    VITE_API_URL = "https://jana-backend.fly.dev/api"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
