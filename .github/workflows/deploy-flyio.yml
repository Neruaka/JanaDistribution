# ============================================================================
# Deploy to Fly.io - Jana Distribution
# ============================================================================
# Auto-deploy TEMPORAIRE pendant la phase de developpement/tests (decision
# utilisateur, 2026-09-05) : chaque push sur `develop` redeploie backend et
# frontend sur les apps de production Fly.io (jana-backend/jana-frontend -
# il n'y a pas d'environnement de staging separe). A desactiver (retirer le
# trigger push, garder workflow_dispatch) une fois le site considere fini -
# voir docs/deploiement/DEPLOY-FLYIO.md pour le deploiement manuel
# equivalent (flyctl deploy).
# ============================================================================

name: 🪂 Deploy to Fly.io

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/deploy-flyio.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: 🔧 Deploy Backend
    runs-on: ubuntu-latest
    environment: flyio
    concurrency: deploy-backend-flyio
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🪂 Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy
        run: flyctl deploy --app jana-backend --remote-only
        working-directory: ./backend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-frontend:
    name: ⚛️ Deploy Frontend
    runs-on: ubuntu-latest
    environment: flyio
    concurrency: deploy-frontend-flyio
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🪂 Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: 🚀 Deploy
        run: flyctl deploy --app jana-frontend --remote-only
        working-directory: ./frontend
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  smoke-test:
    name: 🌐 Smoke test
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-frontend]
    steps:
      - name: Wait for rollout
        run: sleep 15

      - name: Check backend health
        run: curl -f https://jana-backend.fly.dev/api/health

      - name: Check frontend
        run: curl -f -I https://jana-frontend.fly.dev/
