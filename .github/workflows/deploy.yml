# ============================================================================
# Deployment Pipeline - Jana Distribution
# ============================================================================
# ⚠️ DÉSACTIVÉ (2026-09-05, décision utilisateur) — le homeserver
# tfredklab.dev ciblé ci-dessous a été abandonné avant mise en service
# (Phase 11 supersédée par la Phase 14, voir docs/workflow/ETAT_ACTUEL_PROJET.md
# et docs/archive/deploiement/DEPLOY-HOMESERVER.md). La production réelle est
# Fly.io (jana-frontend.fly.dev / jana-backend.fly.dev), déployée
# automatiquement à chaque push `develop` par deploy-flyio.yml (auto-deploy
# temporaire, décision utilisateur 2026-09-05 — voir ce fichier pour le
# détail) ; équivalent manuel : `flyctl deploy` (voir Phase 14, T14-*).
#
# Déclencheur automatique retiré pour ne plus tenter de joindre une cible qui
# n'existe plus à chaque push `develop`. Le job reste disponible en manuel
# (workflow_dispatch) au cas où le homeserver serait un jour remis en
# service, mais nécessiterait d'abord une revalidation complète.
# ============================================================================

name: 🚀 Deploy (désactivé — voir en-tête)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to homeserver
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jana.tfredklab.dev

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: 🚀 Deploy via SSH
        # La clé SSH utilisée ici est restreinte côté serveur à une seule
        # commande forcée (authorized_keys: command="...") — le pipeline
        # exécuté est fixe (git pull && docker compose build && up -d),
        # quel que soit le contenu de `script:` ci-dessous.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOMESERVER_TAILSCALE_IP }}
          username: ${{ secrets.HOMESERVER_SSH_USER }}
          key: ${{ secrets.HOMESERVER_SSH_KEY }}
          script: echo "déploiement déclenché — la commande réelle est forcée côté serveur"

      - name: 🧪 Smoke test
        run: |
          sleep 10
          curl -f https://jana-api.tfredklab.dev/api/health || exit 1
          curl -f https://jana.tfredklab.dev/ || exit 1
          echo "✅ Smoke tests passed!"

      - name: 📊 Summary
        if: always()
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cible :** homeserver (tfredklab.dev)" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend :** https://jana.tfredklab.dev" >> $GITHUB_STEP_SUMMARY
          echo "**API :** https://jana-api.tfredklab.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit :** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Déployé par :** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
