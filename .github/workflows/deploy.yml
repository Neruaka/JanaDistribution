# ============================================================================
# Deployment Pipeline - Jana Distribution
# ============================================================================
# Déploie sur le homeserver (tfredklab.dev) après un push sur develop.
# Un seul environnement (pas de staging Railway distinct — voir Phase 11,
# docs/PLAN_CORRECTION_AUDIT.md). Le homeserver n'est joignable que via Tailscale
# (pas de port SSH ouvert publiquement), donc le runner GitHub rejoint le
# tailnet avant de se connecter.
# ============================================================================

name: 🚀 Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to homeserver
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://jana.tfredklab.dev

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      - name: 🚀 Deploy via SSH
        # La clé SSH utilisée ici est restreinte côté serveur à une seule
        # commande forcée (authorized_keys: command="...") — le pipeline
        # exécuté est fixe (git pull && docker compose build && up -d),
        # quel que soit le contenu de `script:` ci-dessous.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOMESERVER_TAILSCALE_IP }}
          username: ${{ secrets.HOMESERVER_SSH_USER }}
          key: ${{ secrets.HOMESERVER_SSH_KEY }}
          script: echo "déploiement déclenché — la commande réelle est forcée côté serveur"

      - name: 🧪 Smoke test
        run: |
          sleep 10
          curl -f https://jana-api.tfredklab.dev/api/health || exit 1
          curl -f https://jana.tfredklab.dev/ || exit 1
          echo "✅ Smoke tests passed!"

      - name: 📊 Summary
        if: always()
        run: |
          echo "# 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Cible :** homeserver (tfredklab.dev)" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend :** https://jana.tfredklab.dev" >> $GITHUB_STEP_SUMMARY
          echo "**API :** https://jana-api.tfredklab.dev" >> $GITHUB_STEP_SUMMARY
          echo "**Commit :** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Déployé par :** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
