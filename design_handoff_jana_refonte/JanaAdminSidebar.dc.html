<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:236px;height:100%;min-height:100%;box-sizing:border-box;background:#10231A;display:flex;flex-direction:column;padding:18px 14px;font-family:'Instrument Sans',system-ui,sans-serif;flex:none">
  <div style="display:flex;align-items:center;gap:11px;padding:0 6px 20px;border-bottom:1px solid #22402F;margin-bottom:16px">
    <div style="width:30px;height:30px;border-radius:6px;background:#1E7A46;display:flex;align-items:center;justify-content:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:15px">J</div>
    <div style="display:flex;flex-direction:column;line-height:1">
      <span style="font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;color:#fff;letter-spacing:-0.02em">JANA</span>
      <span style="font-size:9px;letter-spacing:0.2em;color:#6B8779;margin-top:3px">BACK-OFFICE</span>
    </div>
  </div>
  <div style="font-size:10.5px;letter-spacing:0.14em;color:#4E6B5C;padding:0 8px 8px">PILOTAGE</div>
  <sc-for list="{{ items }}" as="i" hint-placeholder-count="7">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:6px;margin-bottom:2px;background:{{ i.bg }}">
      <span style="font-size:13.5px;font-weight:{{ i.w }};color:{{ i.c }}">{{ i.nom }}</span>
      <span style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:{{ i.badge }}">{{ i.n }}</span>
    </div>
  </sc-for>
  <div style="margin-top:auto;padding-top:16px;border-top:1px solid #22402F;display:flex;align-items:center;gap:11px">
    <div style="width:32px;height:32px;border-radius:50%;background:#22402F;color:#B9CCC1;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">JA</div>
    <div style="flex:1;line-height:1.3">
      <div style="font-size:13px;color:#fff;font-weight:600">Janaa Adminn</div>
      <div style="font-size:11.5px;color:#6B8779">Administrateur</div>
    </div>
    <span style="color:#6B8779;font-size:14px">⇥</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Dashboard&quot;,&quot;Commandes&quot;,&quot;Produits&quot;,&quot;Catégories&quot;,&quot;Clients&quot;,&quot;Paramètres&quot;],&quot;default&quot;:&quot;Dashboard&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? "Dashboard";
    const src = [
      ["Dashboard", ""], ["Commandes", "3"], ["Produits", "1 240"], ["Catégories", "12"],
      ["Clients", "418"], ["Paramètres", ""]
    ];
    return {
      items: src.map(([nom, n]) => ({
        nom, n,
        bg: nom === active ? "#1E7A46" : "transparent",
        c: nom === active ? "#FFFFFF" : "#B9CCC1",
        w: nom === active ? 600 : 400,
        badge: nom === active ? "#CDEBD8" : "#5E7A6C"
      }))
    };
  }
}
</script>
</body>
</html>
